name: Keep Render API Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 20 --max-time 90 \
            https://appointment-booking-system-tjfd.onrender.com/health/db